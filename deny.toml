# cargo-deny: what scrios may depend on. `cargo deny check` runs in CI (.github/workflows/ci.yml).

[graph]
# Every platform the release builds for, so that platform-only crates are checked too.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable. It is reached only through winit's Wayland title bar (winit > sctk-adwaita > ab_glyph >
    # ttf-parser), which parses the user's own system font to draw the window's title: no video, no device and no network
    # data goes near it. The viewer feature is the only way to it. Revisit with winit 0.31.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser, only in winit's Wayland title bar, on the user's own font" },
]

[licenses]
version = 2
# Compatible with distributing scrios under Apache-2.0. An expression with OR passes when one side is here.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# One crate under a licence that is not in the list above: the Mozilla CA bundle that scrios's own https download of
# the developer disk image (src/ddi/http.rs) and idevice's `tss` feature (the Apple signing server request that
# installing it makes) use for https. CDLA-Permissive-2.0 is a permissive licence for data (attribution, no
# copyleft). It is allowed for this crate only.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies: everything comes from crates.io.
allow-git = []
