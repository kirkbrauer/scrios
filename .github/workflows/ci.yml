name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Any warning fails the build: rustc's, clippy's (the lints are in Cargo.toml's [lints]) and rustdoc's.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Pinned so that a new Rust (and its new lints) arrives as a change, not mid-review.
  RUST_TOOLCHAIN: 1.96.0

jobs:
  check:
    name: fmt, clippy, test, doc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Every `run` is bash (Git Bash on Windows): one syntax on the three hosts, and a command that fails in a
    # multi-line step stops it (PowerShell would go on to the next line).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # What these two check does not depend on the host: once, not on every one.
      - name: idevice is pinned exactly
        if: runner.os == 'Linux'
        run: scripts/check-pins.sh
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: |
          cargo test --all-targets --all-features --locked
          cargo test --doc --all-features --locked
      # The build the static Linux release binaries are: no viewer, so no window system, GPU or video decoder in it.
      - name: headless (--no-default-features) clippy and test
        run: |
          cargo clippy --all-targets --no-default-features --locked -- -D warnings
          cargo test --all-targets --no-default-features --locked
      - name: cargo doc
        run: cargo doc --no-deps --all-features --locked
      - name: build (release)
        run: cargo build --release --locked
      # smoke.sh needs python3, unix sockets and signals: unix only. smoke-minimal.sh needs none of them and runs on
      # all three, so that it is what Windows is checked with and cannot rot on the other two.
      - name: smoke test (no device)
        if: runner.os != 'Windows'
        run: scripts/smoke.sh target/release/scrios
      - name: smoke test, minimal (no device)
        run: scripts/smoke-minimal.sh "target/release/scrios${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: fuzz harnesses build
        if: runner.os != 'Windows'
        working-directory: fuzz
        run: cargo build --locked

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: read rust-version
        id: msrv
        run: echo "version=$(sed -n -E 's/^rust-version = "([0-9.]+)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: cargo check with ${{ steps.msrv.outputs.version }}
        # Lints newer than this toolchain are unknown to it: that alone is not a failure.
        env:
          RUSTFLAGS: -D warnings -A unknown-lints
        run: cargo check --all-targets --all-features --locked

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          arguments: --all-features --locked

  musl:
    name: static musl build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: install cargo-zigbuild
        run: pipx install cargo-zigbuild
      - name: build
        run: |
          cargo zigbuild --release --locked --no-default-features --target "${{ matrix.target }}"
          file "target/${{ matrix.target }}/release/scrios"
      - name: smoke test (x86_64 only, no device)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/smoke.sh "target/${{ matrix.target }}/release/scrios"

  package:
    name: crates.io package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: cargo publish --dry-run
        run: |
          cargo package --list --locked
          cargo publish --dry-run --locked
