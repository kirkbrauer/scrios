name: Release

# A tag `vX.Y.Z` builds the release binaries and attaches them to a GitHub release:
#   scrios-x86_64-linux-musl, scrios-aarch64-linux-musl   static (musl), any Linux distribution
#   scrios-aarch64-apple-darwin                            macOS on Apple silicon
# plus SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.96.0

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: scrios-x86_64-linux-musl, zig: true, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: scrios-aarch64-linux-musl, zig: true, smoke: false }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: scrios-aarch64-apple-darwin, zig: false, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      # Static musl binaries are cross-built with zig as the C compiler and linker: aws-lc-sys (the TLS backend)
      # compiles its C sources with `cc` (no CMake, no bindgen for these targets).
      - name: install cargo-zigbuild
        if: matrix.zig
        run: pipx install cargo-zigbuild
      - name: build
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/scrios" "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}"
      - name: smoke test (no device)
        if: matrix.smoke
        run: scripts/smoke.sh "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum scrios-* > SHA256SUMS && cat SHA256SUMS
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
