name: Release

# A tag `vX.Y.Z` (equal to `version` in Cargo.toml) releases scrios:
#   1. checks that the tagged commit is on main and the tag against Cargo.toml, and runs the tests;
#   2. builds scrios-*-linux-musl for x64 and ARM64 (static, any Linux distribution, headless: built with
#      --no-default-features, so without the viewer window), scrios-aarch64-apple-darwin (with the viewer; Intel Macs
#      are not supported) and scrios-*-pc-windows-msvc.zip for x64 and ARM64 (scrios.exe with the README, LICENSE and
#      NOTICE, with the viewer), with SHA256SUMS. All five are required: if one does not build, there is no release;
#   3. creates the GitHub release with them;
#   4. publishes the crate to crates.io, with Trusted Publishing (OIDC) if it is configured for this repository,
#      else with the CARGO_REGISTRY_TOKEN secret (the first publish of a crate needs the token).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.96.0

jobs:
  check:
    name: tag, version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history and the branches, for the check that the commit is on main.
          fetch-depth: 0
      # Only what went through a pull request and its checks is released.
      - name: the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} is $(git rev-parse HEAD), which is not on main: tag a commit that is merged"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: the tag is the version in Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME}, but Cargo.toml says ${version} (expected v${version})"
            exit 1
          fi
          echo "releasing ${version}"
      - name: idevice is pinned exactly
        run: scripts/check-pins.sh
      - name: cargo test
        run: cargo test --all-targets --locked

  build:
    name: build ${{ matrix.asset }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: scrios-x86_64-linux-musl, zig: true, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: scrios-aarch64-linux-musl, zig: true, smoke: false }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: scrios-aarch64-apple-darwin, zig: false, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      # Static musl binaries are cross-built with zig as the C compiler and linker: ring (the TLS backend)
      # compiles its C and assembly with `cc` (no CMake, no bindgen).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig
        with:
          version: 0.17.1
      - name: install cargo-zigbuild
        if: matrix.zig
        run: pipx install cargo-zigbuild
      - name: build
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --no-default-features --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/scrios" "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}"
      - name: smoke test (no device)
        if: matrix.smoke
        run: scripts/smoke.sh "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Windows: scrios.exe, linked with MSVC, in a zip with the documents. The ARM64 build is a cross-build on the x64
  # runner, which cannot run it.
  build-windows:
    name: build ${{ matrix.asset }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, asset: scrios-x86_64-pc-windows-msvc.zip, smoke: true }
          - { target: aarch64-pc-windows-msvc, asset: scrios-aarch64-pc-windows-msvc.zip, smoke: false }
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      # The x64 build runs on this runner; the ARM64 one cannot.
      - name: smoke test (no device)
        if: matrix.smoke
        run: scripts/smoke-minimal.sh "target/${{ matrix.target }}/release/scrios.exe"
      - name: zip scrios.exe with the README, LICENSE and NOTICE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force -DestinationPath "dist/${{ matrix.asset }}" `
            -Path "target/${{ matrix.target }}/release/scrios.exe", README.md, LICENSE, NOTICE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}-zip
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum scrios-* > SHA256SUMS && cat SHA256SUMS
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}" --title "scrios ${GITHUB_REF_NAME}" --generate-notes --verify-tag

  crates-io:
    name: publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Trusted Publishing: a short-lived token from crates.io for this workflow. It only works once the crate exists
      # and trusts this repository and workflow, so it may fail; the stored token is the fallback.
      - name: crates.io Trusted Publishing
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          VIA: ${{ steps.auth.outputs.token && 'Trusted Publishing' || 'the CARGO_REGISTRY_TOKEN secret' }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::no crates.io credential: configure Trusted Publishing for this workflow on crates.io, or set the CARGO_REGISTRY_TOKEN secret"
            exit 1
          fi
          echo "publishing with ${VIA}"
          cargo publish --locked
