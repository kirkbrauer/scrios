[package]
name = "scrios"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "The screen of an iOS device as an H.264 or HEVC stream, with touch and keys, over Apple's CoreDevice display and HID services"
license = "Apache-2.0"
repository = "https://github.com/kirkbrauer/scrios"
readme = "README.md"
keywords = ["ios", "screen", "h264", "hevc", "coredevice"]
categories = ["multimedia::video", "command-line-utilities"]
# What goes into the crates.io package: the sources and the documents, not the CI, the fuzz harnesses or the scripts.
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/BUILD.md", "/docs/*.md"]

[lib]
name = "scrios"
path = "src/lib.rs"

[[bin]]
name = "scrios"
path = "src/main.rs"

[dependencies]
# The CoreDevice display service, tunnel and usbmuxd client (MIT). Pinned EXACTLY (`=`): its API changes between
# releases, so `cargo update` and downstream resolution must not move it. Bumping it is a deliberate change: update
# the version here and in the README's "Compatibility" line, run the tests, and smoke-test against a real device.
idevice = { version = "=0.1.68", default-features = false, features = [
  "aws-lc",
  "display_stream",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "usbmuxd",
  "rsd",
  "xpc",
] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The lints that apply to every build (`cargo build`, `clippy`, `test`, `doc`), CI included, where warnings are errors.
# The parser modules (avc, sps, depack, commands) deny more, at the top of each file: no unwrap, expect, panic,
# indexing or unchecked arithmetic on what comes off the wire. Nothing is allowed here crate-wide: a lint that does
# not fit one item is `#[expect(.., reason = "..")]` on that item.
[lints.rust]
# The one `unsafe` block, `dup`/`dup2` of stdout in main.rs, is allowed on its function, with its safety argument.
unsafe_code = "deny"
# The crate's types are public, so a consumer can print them in a log or an `assert_eq!`.
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A failed unwrap is a panic that a stream can hear: outside the tests (clippy.toml) they are errors to handle.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
