[package]
name = "scrios"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "The screen of an iOS device as an H.264 or HEVC stream, with touch and keys, over Apple's CoreDevice display and HID services"
license = "Apache-2.0"
repository = "https://github.com/kirkbrauer/scrios"
readme = "README.md"
keywords = ["ios", "screen", "h264", "hevc", "coredevice"]
categories = ["multimedia::video", "command-line-utilities"]
publish = false

[lib]
name = "scrios"
path = "src/lib.rs"

[[bin]]
name = "scrios"
path = "src/main.rs"

[dependencies]
# The CoreDevice display service, tunnel and usbmuxd client (MIT). Pinned by commit; see BUILD.md for
# building against a local checkout when GitHub is not reachable.
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "2dca9a58a9a1dd02ec7d6213fcfd8fe861e74132", version = "0.1.68", default-features = false, features = [
  "aws-lc",
  "display_stream",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "usbmuxd",
  "rsd",
  "xpc",
] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
