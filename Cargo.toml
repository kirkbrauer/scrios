[package]
name = "scrios"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The screen of an iOS device as an H.264 or HEVC stream, with touch and keys, over Apple's CoreDevice display and HID services"
license = "Apache-2.0"
repository = "https://github.com/kirkbrauer/scrios"
readme = "README.md"
keywords = ["ios", "screen", "h264", "hevc", "coredevice"]
categories = ["multimedia::video", "command-line-utilities"]
# What goes into the crates.io package: the sources and the documents, not the CI, the fuzz harnesses or the scripts.
include = ["/src/**/*.rs", "/src/**/*.wgsl", "/src/viewer/testdata/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/NOTICE", "/BUILD.md", "/docs/*.md"]

[features]
# The viewer window: `scrios` without a subcommand opens it. On by default for desktop builds; the static Linux
# release binaries are built `--no-default-features` and stay headless (no window system, no GPU, no video decoder
# in the binary).
default = ["viewer"]
viewer = [
  "dep:winit",
  "dep:wgpu",
  "dep:pollster",
  "dep:bytemuck",
  "dep:openh264",
  "dep:objc2-core-foundation",
  "dep:objc2-core-media",
  "dep:objc2-core-video",
  "dep:objc2-video-toolbox",
]

[lib]
name = "scrios"
path = "src/lib.rs"

[[bin]]
name = "scrios"
path = "src/main.rs"

[dependencies]
# The CoreDevice display service, tunnel and usbmuxd client (MIT). TLS through rustls on `ring`, not idevice's
# default aws-lc: the same backend on every platform, with no CMake or NASM (Windows). Pinned EXACTLY (`=`): its API changes between
# releases, so `cargo update` and downstream resolution must not move it. Bumping it is a deliberate change: update
# the version here and in the README's "Compatibility" line, run the tests, and smoke-test against a real device.
idevice = { version = "=0.1.68", default-features = false, features = [
  "ring",
  "display_stream",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "usbmuxd",
  "rsd",
  "xpc",
  "mobile_image_mounter",
  "cryptexd",
  "tss",
  "amfi",
] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The https download of the developer disk image's files (src/ddi/http.rs): rustls on `ring` (the backend idevice is
# built with above) and the Mozilla roots. All three are in the tree already through idevice (`ring` and `tss`), at
# these versions and features: they add no crate. idevice's own HTTP client follows a redirect to any host and reads
# a body of any size, which is not what a file that goes to a device is downloaded with.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# The host's own trust store, and $SSL_CERT_FILE / $SSL_CERT_DIR, added to the Mozilla roots for that download: a
# corporate proxy that inspects TLS signs with a CA that only the host knows.
rustls-native-certs = "0.8"
# Already in the tree through idevice's mounter: the SHA-256 that a downloaded developer disk image is checked against.
sha2 = "0.10"
# Unpacks a downloaded developer disk image (a .tar.gz); no extended attributes.
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

# The viewer (feature `viewer`).
winit = { version = "0.30", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "gles", "dx12"] }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
# The software H.264 decoder (Cisco's OpenH264, built from source; BSD-2-Clause). To load Cisco's own prebuilt binary
# at run time instead (it carries Cisco's H.264 patent licence, a build from source does not), see `api()` in
# src/viewer/decode/software.rs: this line becomes `default-features = false, features = ["libloading"]`.
openh264 = { version = "0.9", optional = true }

# Platform-only: nothing below is built for the other platform.
[target.'cfg(unix)'.dependencies]
# `dup` and `dup2`, to keep the stream's own copy of stdout (see `take_stdout` in main.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `SetStdHandle`, the Windows form of the same (see `take_stdout` in main.rs). Already in the tree through tokio, mio
# and socket2, at this version: it adds no crate.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# The macOS hardware decoder: VideoToolbox, through the objc2 project's bindings (generated from Apple's headers).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "CMBase",
  "CMBlockBuffer",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
  "objc2-core-video",
] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-video-toolbox = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "VTBase",
  "VTDecompressionProperties",
  "VTDecompressionSession",
  "VTErrors",
  "VTSession",
  "objc2-core-media",
  "objc2-core-video",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The lints that apply to every build (`cargo build`, `clippy`, `test`, `doc`), CI included, where warnings are errors.
# The parser modules (avc, sps, depack, commands) deny more, at the top of each file: no unwrap, expect, panic,
# indexing or unchecked arithmetic on what comes off the wire. Nothing is allowed here crate-wide: a lint that does
# not fit one item is `#[expect(.., reason = "..")]` on that item.
[lints.rust]
# The one `unsafe` block per platform, in `take_stdout` in main.rs (`dup` and `dup2` on unix, `SetStdHandle` on
# Windows), is allowed on its function, with its safety argument.
unsafe_code = "deny"
# The crate's types are public, so a consumer can print them in a log or an `assert_eq!`.
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A failed unwrap is a panic that a stream can hear: outside the tests (clippy.toml) they are errors to handle.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
